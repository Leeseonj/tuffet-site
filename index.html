<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuffet</title>
<style>
:root{--bg:#F8FBF6;--fg:#33302B;--line:#DFE7DC;--accent:#2A7339;--soft:#E6F1E0;--panel:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#17201A;--fg:#F0EADF;--line:#2C3B30;--accent:#8FCB92;--soft:#23392A;--panel:#1F2A22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);word-break:keep-all;overflow-wrap:break-word;
 font:16px/1.75 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
 padding:48px 20px 96px}
main{max-width:720px;margin:0 auto}
h1{font-size:28px;line-height:1.3;margin:0 0 24px;letter-spacing:-.02em}
h2{font-size:20px;margin:40px 0 12px;padding-top:20px;border-top:1px solid var(--line);letter-spacing:-.01em}
h3{font-size:16px;margin:24px 0 8px;color:var(--accent)}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px;padding-left:22px}li{margin-bottom:6px}
code{background:var(--soft);border-radius:4px;padding:1px 5px;font-size:.9em}
blockquote{margin:0 0 16px;padding:12px 16px;background:var(--soft);border-radius:10px}
blockquote p{margin:0}
.tw{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Tuffet</h1>
<p>장기 목표만 적어두면 오늘 할 일은 AI가 짭니다.</p>
<ul>
<li><a href="./privacy.html">개인정보처리방침</a></li>
<li><a href="./support.html">문의·자주 묻는 것</a></li>
</ul>
</main>
</body>
</html>
